<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>So sánh landing page | Vũ Kim Khánh</title>
  <style>
    :root { font-family: Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #eee8ee; background: #141018; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 22px; border-bottom: 1px solid #433649; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header p { margin: 0; color: #bdacbf; font-size: 13px; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 10px; }
    .panel { min-width: 0; overflow: hidden; border: 1px solid #4c3a4f; border-radius: 12px; background: #100811; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 10px 14px; }
    .panel-head strong { font-size: 14px; }
    .panel-head a { color: #eac48b; font-size: 13px; }
    iframe { display: block; width: 100%; height: calc(100vh - 132px); min-height: 520px; border: 0; background: #100811; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } iframe { height: 75vh; min-height: 480px; } }
  </style>
</head>
<body>
  <header><h1>So sánh landing page Vũ Kim Khánh</h1><p>Cuộn từng khung để xem cùng một section</p></header>
  <main>
    <section class="panel" aria-label="Phương án A"><div class="panel-head"><strong>A · Bản hiện tại</strong><a href="index.html" target="_blank" rel="noopener">Mở riêng</a></div><iframe src="index.html" title="Phương án A"></iframe></section>
    <section class="panel" aria-label="Phương án B"><div class="panel-head"><strong>B · Nhịp màu và khối mới</strong><a href="index-variant-b.html" target="_blank" rel="noopener">Mở riêng</a></div><iframe src="index-variant-b.html" title="Phương án B"></iframe></section>
  </main>
</body>
</html>
